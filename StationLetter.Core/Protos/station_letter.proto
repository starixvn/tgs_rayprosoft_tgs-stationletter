syntax = "proto3";

option csharp_namespace = "Tgs.StationLetter.Protos";

import "phoenix/protobuf/guid.proto";
import "google/protobuf/timestamp.proto";

message SendLetterRequest {
	string sender = 1;
	repeated string receivers = 2;
	string subject = 3;
	string content = 4;
	phoenix.protobuf.GuidValue come_from = 5;
	google.protobuf.Timestamp sent_on = 6;
}